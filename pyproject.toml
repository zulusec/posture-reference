[project]
name = "posture-reference"
version = "0.1.0"
description = "Reference implementation: read-only AWS posture checks with deterministic output"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["boto3>=1.34"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
posture = "posture.cli:run"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
posture = ["demo/fixtures/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
